name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar, probar y analizar
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Compilar proyecto (debug)
        run: ./gradlew assembleDebug

      - name: Ejecutar pruebas unitarias
        run: ./gradlew testDebugUnitTest

      # Lint informa problemas; de momento no bloquea el pipeline.
      # Cuando el reporte esté limpio, quita "continue-on-error".
      - name: Análisis estático (Android Lint)
        run: ./gradlew lintDebug
        continue-on-error: true

      - name: Guardar reportes de pruebas y lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reportes
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Guardar APK de depuración
        uses: actions/upload-artifact@v7
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/*.apk

  secretos:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Descargar código (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar claves o contraseñas subidas por error
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
